name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build and publish, e.g. v0.7.0"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyPI accepts a filename once. Under the release trigger the tag fixes
      # which tree gets built; a manual run can point at any ref, so check that
      # the version being uploaded is the one the ref is named for.
      - name: Check pyproject version against the ref
        env:
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$v" != "${REF#v}" ]; then
            echo "pyproject.toml says $v, ref is $REF" >&2
            exit 1
          fi
          echo "publishing remex $v from $REF"

      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
