[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remex"
version = "0.7.0"
description = "Retrieval-validated embedding compression. 4-8x smaller vectors, proven recall."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Oskar Austegard"}]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
arrow = ["pyarrow>=12.0"]
bench = ["faiss-cpu", "sentence-transformers"]

[tool.setuptools.packages.find]
# The Mojo port is checkout-only and is deliberately not distributed: `.mojo`
# sources are not installable by pip, and Mojo is not a declarable dependency.
# Without this exclude, `remex/mojo/` contributes no .mojo files to the wheel
# (setuptools ships only .py without package-data) but DOES ship its bench
# driver and two test-fixture builders — a package path whose actual content
# is absent. Run the Mojo paths from a checkout.
include = ["remex*"]
exclude = ["remex.mojo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/oaustegard/remex"
Repository = "https://github.com/oaustegard/remex"
Issues = "https://github.com/oaustegard/remex/issues"
